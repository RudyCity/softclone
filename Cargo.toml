[package]
name = "softclone"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Native portable application cloning workspace"
repository = "https://github.com/RudyCity/softclone"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rune = "0.14.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
thiserror = "2"
rfd = "0.17.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
win_icon_extractor = { package = "win-icon-extractor", version = "0.3.0", default-features = false }

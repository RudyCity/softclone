[package]
name = "softclone"
version = "0.6.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Local portable app cloning and profile engine powering the SoftClone Tauri desktop"
repository = "https://github.com/RudyCity/softclone"
autobins = false

[dependencies]
rune = "0.14.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>SoftClone — Desktop workspace</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
        <div><div class="brand-title">SoftClone</div><div class="brand-subtitle">DESKTOP WORKSPACE</div></div>
      </div>
      <div class="side-label">WORKSPACE</div>
      <nav class="nav">
        <button class="nav-item active" data-page="library"><span class="nav-symbol nav-symbol-grid"></span>My clones <span class="nav-count" id="sidebar-count">0</span></button>
        <button class="nav-item" data-page="create"><span class="nav-symbol nav-symbol-plus"></span>Create clone</button>
        <button class="nav-item" data-page="discover"><span class="nav-symbol nav-symbol-search"></span>Discover apps</button>
      </nav>
      <div class="side-label spaced">TOOLS & HELP</div>
      <nav class="nav">
        <button class="nav-item" data-page="logs"><span class="nav-symbol nav-symbol-terminal"></span>Debug logs</button>
        <button class="nav-item" data-page="guide"><span class="nav-symbol nav-symbol-book"></span>How it works</button>
        <button class="nav-item" data-page="about"><span class="nav-symbol nav-symbol-info"></span>About</button>
      </nav>
      <div class="side-footer">
        <div class="status-block"><span class="status-dot"></span><div><strong>Local workspace</strong><small>Files never leave your computer</small></div></div>
        <button data-action="external-support" class="support-link">Support development <span aria-hidden="true">↗</span></button>
        <div class="side-version" id="sidebar-version">TAURI DESKTOP</div>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar"><div class="topbar-context">SOFTCLONE <span class="slash">/</span> <span id="breadcrumb">MY CLONES</span></div><div class="topbar-right"><span class="platform-tag" id="platform-tag">LOCAL</span><span class="top-avatar">S</span></div></header>
      <main id="view" class="workspace" tabindex="-1" aria-live="polite"><div class="loading-state">Opening local workspace…</div></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
</body>
</html>

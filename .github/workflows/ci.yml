name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release --bin softclone
      - name: Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: softclone-windows-x64
          path: target/release/softclone.exe
          if-no-files-found: error
      - name: macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: softclone-macos
          path: target/release/softclone
          if-no-files-found: error
      - name: Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: softclone-linux-x64
          path: target/release/softclone
          if-no-files-found: error

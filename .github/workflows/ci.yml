name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release --bin softclone
      - name: Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: softclone-windows-x64
          path: target/release/softclone.exe
          if-no-files-found: error
      - name: macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: softclone-macos-${{ runner.arch }}
          path: target/release/softclone
          if-no-files-found: error
      - name: Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: softclone-linux-x64
          path: target/release/softclone
          if-no-files-found: error

  publish:
    name: Publish v0.5.4
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Windows binary
        uses: actions/download-artifact@v4
        with:
          name: softclone-windows-x64
          path: dist/windows
      - name: Download verified Linux binary
        uses: actions/download-artifact@v4
        with:
          name: softclone-linux-x64
          path: dist/linux
      - name: Download verified macOS binary
        uses: actions/download-artifact@v4
        with:
          pattern: softclone-macos-*
          path: dist/macos
      - name: Prepare versioned archives
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/windows/softclone.exe
          test -s dist/linux/softclone
          mkdir -p release
          (cd dist/windows && zip -q ../../release/SoftClone-v0.5.4-windows-x64.zip softclone.exe)
          chmod +x dist/linux/softclone
          tar -czf release/SoftClone-v0.5.4-linux-x64.tar.gz -C dist/linux softclone
          found=0
          while IFS= read -r -d '' binary; do
            found=1
            parent=$(basename "$(dirname "$binary")")
            arch=$(printf '%s' "${parent#softclone-macos-}" | tr '[:upper:]' '[:lower:]')
            chmod +x "$binary"
            tar -czf "release/SoftClone-v0.5.4-macos-${arch}.tar.gz" -C "$(dirname "$binary")" softclone
          done < <(find dist/macos -type f -name softclone -print0)
          test "$found" -eq 1
          (cd release && sha256sum SoftClone-v0.5.4-* > SHA256SUMS.txt)
      - name: Publish only after all platform tests and builds succeed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.5.4 >/dev/null 2>&1; then
            echo "Release v0.5.4 is already published. Leaving published assets unchanged."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.4 >/dev/null 2>&1; then
            echo "::error::Tag v0.5.4 already exists. Refusing to publish against a possibly different commit."
            exit 1
          fi
          gh release create v0.5.4 release/* \
            --target "$GITHUB_SHA" \
            --title "SoftClone v0.5.4" \
            --notes-file docs/releases/v0.5.4.md

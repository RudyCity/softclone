[package]
name = "softclone-desktop"
version = "0.6.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "SoftClone Tauri 2 desktop host"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
softclone = { path = ".." }
tauri = { version = "2", features = [] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
